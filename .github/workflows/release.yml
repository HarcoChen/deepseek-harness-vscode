name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${{ inputs.tag || github.ref_name }}"

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}." >&2
            exit 1
          fi

          # Two independent signals mark a build as "not for the general
          # channel", and either one is enough:
          #
          #   * an odd minor version. From 0.8.0 on, stable rides even minors
          #     (0.8.x) and the pre-release track stays a minor ahead (0.9.x).
          #     Clients always update to the highest version number regardless
          #     of channel, so keeping the pre-release number above every
          #     stable one is what stops a stable release from pulling
          #     pre-release users out of their channel.
          #   * a SemVer pre-release suffix (0.6.0-beta.1). Kept because the
          #     VS Code Marketplace rejects such versions outright — those
          #     builds can only ever reach Open VSX and GitHub Releases.
          #
          # A marked build is packaged and published with `--pre-release`, so
          # the registry flags it and only users who opted into pre-releases
          # upgrade into it; the GitHub release is marked pre-release too.
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]] || (( MINOR % 2 == 1 )); then
            PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Run checks
        run: npm test

      - name: Extract changelog entry
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          awk -v version="${VERSION}" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no entry for ${VERSION}." >&2
            exit 1
          fi

      - name: Package extension
        shell: bash
        env:
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        # `--pre-release` writes the marker into the vsix manifest itself, so
        # the flag survives packaging and publishing as one decision.
        #
        # Deliberately no `--no-dependencies`: the host code requires `ws` at
        # runtime, and that flag makes vsce skip node_modules collection
        # altogether, so the `!node_modules/ws/**` negations in .vscodeignore
        # never apply. 0.7.0-beta.1 shipped that way and could not activate.
        run: |
          if [[ "${PRERELEASE}" == "true" ]]; then
            npm run package -- --pre-release
          else
            npm run package
          fi

      - name: Verify runtime dependencies are bundled
        shell: bash
        env:
          VSIX: ${{ steps.metadata.outputs.vsix }}
        # A dependency missing from the package only fails at activation, where
        # it looks like the extension hanging on load rather than an error.
        # Fail the release instead of publishing an unloadable build.
        run: |
          missing=0
          for dep in $(node -p "Object.keys(require('./package.json').dependencies ?? {}).join(' ')"); do
            if ! unzip -l "${VSIX}" | grep -q "extension/node_modules/${dep}/package.json"; then
              echo "Runtime dependency '${dep}' is missing from ${VSIX}." >&2
              missing=1
            fi
          done
          if [[ "${missing}" != "0" ]]; then
            echo "Check .vscodeignore negations and that packaging does not pass --no-dependencies." >&2
            exit 1
          fi
          echo "All declared runtime dependencies are present in ${VSIX}."

      - name: Publish to Open VSX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.metadata.outputs.vsix }}
        # No `--pre-release` here: ovsx ignores the flag for a prepackaged vsix
        # ("Ignoring option '--pre-release' for prepackaged extension") and reads
        # the `Microsoft.VisualStudio.Code.PreRelease` marker that the packaging
        # step wrote into the manifest instead.
        run: npx --yes ovsx publish "${VSIX}" -p "${OVSX_PAT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.metadata.outputs.vsix }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
